
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Robot en Realidad Aumentada</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #titulo {
            position: fixed;
            top: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            z-index: 10;
            text-shadow: 2px 2px 4px black;
        }

        #botones {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        button {
            padding: 12px 15px;
            margin: 4px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            background: white;
        }
    </style>
</head>

<body>

    <h2 id="titulo">🤖 Mi Robot en Realidad Aumentada</h2>

    <!-- BOTONES -->
    <div id="botones">
        <button onclick="cambiarColor()">🎨 Color</button>
        <button onclick="agrandar()">🔍 Tamaño +</button>
        <button onclick="reducir()">🔎 Tamaño -</button>
        <button onclick="girar()">🔄 Girar</button>
        <button onclick="mover()">📍 Mover</button>
    </div>

    <!-- ESCENA DE REALIDAD AUMENTADA -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam;">

        <!-- MARCADOR HIRO -->
        <a-marker preset="hiro">

            <!-- PISO / REFERENCIA VISUAL -->
            <a-plane
                rotation="-90 0 0"
                width="3"
                height="3"
                color="#555555">
            </a-plane>

            <!-- ROBOT -->
            <a-entity id="robot" position="0 0 0">

                <!-- CUERPO -->
                <a-box
                    id="cuerpo"
                    position="0 1 0"
                    width="1"
                    height="1.2"
                    depth="0.7"
                    color="#2196F3">
                </a-box>

                <!-- CABEZA -->
                <a-box
                    position="0 1.9 0"
                    width="0.9"
                    height="0.7"
                    depth="0.7"
                    color="#90CAF9">
                </a-box>

                <!-- OJO IZQUIERDO -->
                <a-sphere
                    position="-0.2 2 0.36"
                    radius="0.08"
                    color="black">
                </a-sphere>

                <!-- OJO DERECHO -->
                <a-sphere
                    position="0.2 2 0.36"
                    radius="0.08"
                    color="black">
                </a-sphere>

                <!-- BRAZO IZQUIERDO -->
                <a-box
                    position="-0.65 1 0"
                    width="0.25"
                    height="0.9"
                    depth="0.25"
                    color="#1565C0">
                </a-box>

                <!-- BRAZO DERECHO -->
                <a-box
                    position="0.65 1 0"
                    width="0.25"
                    height="0.9"
                    depth="0.25"
                    color="#1565C0">
                </a-box>

                <!-- PIERNA IZQUIERDA -->
                <a-box
                    position="-0.25 0.15 0"
                    width="0.3"
                    height="0.7"
                    depth="0.35"
                    color="#0D47A1">
                </a-box>

                <!-- PIERNA DERECHA -->
                <a-box
                    position="0.25 0.15 0"
                    width="0.3"
                    height="0.7"
                    depth="0.35"
                    color="#0D47A1">
                </a-box>

                <!-- ANTENA -->
                <a-cylinder
                    position="0 2.55 0"
                    radius="0.04"
                    height="0.3"
                    color="black">
                </a-cylinder>

                <a-sphere
                    position="0 2.73 0"
                    radius="0.1"
                    color="red">
                </a-sphere>

            </a-entity>

        </a-marker>

        <!-- CÁMARA -->
        <a-entity camera></a-entity>

    </a-scene>

    <script>

        let escala = 1;
        let rotacion = 0;
        let posicion = 0;

        // CAMBIAR COLOR DEL ROBOT
        function cambiarColor() {

            let cuerpo = document.querySelector("#cuerpo");

            if (cuerpo.getAttribute("color") === "#2196F3") {
                cuerpo.setAttribute("color", "#E91E63");
            } else {
                cuerpo.setAttribute("color", "#2196F3");
            }
        }

        // AUMENTAR TAMAÑO
        function agrandar() {

            escala += 0.2;

            document.querySelector("#robot")
                .setAttribute("scale",
                `${escala} ${escala} ${escala}`);
        }

        // REDUCIR TAMAÑO
        function reducir() {

            if (escala > 0.4) {
                escala -= 0.2;
            }

            document.querySelector("#robot")
                .setAttribute("scale",
                `${escala} ${escala} ${escala}`);
        }

        // GIRAR ROBOT
        function girar() {

            rotacion += 45;

            document.querySelector("#robot")
                .setAttribute("rotation",
                `0 ${rotacion} 0`);
        }

        // CAMBIAR POSICIÓN
        function mover() {

            posicion += 0.3;

            document.querySelector("#robot")
                .setAttribute("position",
                `${posicion} 0 0`);
        }

        // TOCAR ROBOT = CAMBIAR COLOR
        document.querySelector("#robot").addEventListener("click", function () {
            cambiarColor();
        });

    </script>

</body>
</html>
